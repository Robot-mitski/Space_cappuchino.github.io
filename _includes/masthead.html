<header class="site-header">
  <div class="site-header__inner">
    <a class="site-brand" href="{{ '/' | relative_url }}" aria-label="Моя чашка кофе — на главную">
      <span class="brand-icon" aria-hidden="true">{% include coffee-mark.svg %}</span>
      <span>Моя чашка кофе<span class="brand-subtitle">Личный сайт Ники Смирновой</span></span>
    </a>
    <nav class="site-navigation" aria-label="Основная навигация">
      {% for link in site.data.navigation.main %}
      <a href="{{ link.url | relative_url }}"{% if page.url == link.url %} aria-current="page"{% endif %}>{{ link.title }}</a>
      {% endfor %}
    </nav>
    <button class="color-mode" type="button" aria-label="Включить тёмную тему" aria-pressed="false" hidden><span aria-hidden="true">◐</span></button>
  </div>
</header>
